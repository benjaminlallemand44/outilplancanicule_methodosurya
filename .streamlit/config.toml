# Charte graphique ACTEE (design system ACTEE, octobre 2024)
[server]
maxUploadSize = 25
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0a17a6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f4f1"
textColor = "#000000"
linkColor = "#0a17a6"
borderColor = "#000000"
font = "Schibsted Grotesk, Arial, sans-serif"
headingFont = "Bitter, Georgia, serif"
headingFontWeights = 900
baseRadius = "none"
buttonRadius = "none"

[[theme.fontFaces]]
family = "Schibsted Grotesk"
url = "app/static/fonts/SchibstedGrotesk-Medium.woff2"
weight = "400"

[[theme.fontFaces]]
family = "Schibsted Grotesk"
url = "app/static/fonts/SchibstedGrotesk-Medium.woff2"
weight = "500"

[[theme.fontFaces]]
family = "Schibsted Grotesk"
url = "app/static/fonts/SchibstedGrotesk-Bold.woff2"
weight = "600"

[[theme.fontFaces]]
family = "Schibsted Grotesk"
url = "app/static/fonts/SchibstedGrotesk-Bold.woff2"
weight = "700"

[[theme.fontFaces]]
family = "Schibsted Grotesk"
url = "app/static/fonts/SchibstedGrotesk-ExtraBold.woff2"
weight = "800"

[[theme.fontFaces]]
family = "Schibsted Grotesk"
url = "app/static/fonts/SchibstedGrotesk-Black.woff2"
weight = "900"

[[theme.fontFaces]]
family = "Bitter"
url = "app/static/fonts/Bitter-ExtraBold.woff2"
weight = "800"

[[theme.fontFaces]]
family = "Bitter"
url = "app/static/fonts/Bitter-Black.woff2"
weight = "900"
