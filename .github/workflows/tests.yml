name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Outils système (lecture des PDF)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (hors recalcul Excel par LibreOffice et hors navigateur réel)
        run: pytest -q -m "not excel and not interface"
